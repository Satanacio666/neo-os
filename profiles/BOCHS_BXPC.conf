# NeoOS Hardware Profile — BOCHS_BXPC
#
# Identidade derivada da DESCOBERTA (ACPI: oem_id + oem_table_id do XSDT).
# Nada aqui e digitado no codigo: o perfil e DADO, e adicionar um aparelho passa
# a ser soltar um arquivo na ESP, sem recompilar o OS.
#
# INVARIANTE: este arquivo e OPCIONAL. Sem ele o sistema boota com defaults
# seguros. Perfil ausente => boota. Perfil presente => boota melhor.
# Nunca "boota ou nao".
#
# Formato: chave = valor inteiro. '#' comenta.

# Politica do rasterizador
tile_size = 64
use_morton_order = 1

# SMP
smp_affinity_policy = 0
smp_max_active_cores = 4

# Silicio: erratas e estrangulamento termico
errata_flags = 0
throttle_delay_us = 0
